# Read about fixtures at https://api.rubyonrails.org/classes/ActiveRecord/FixtureSet.html
# Employeeフィクスチャ: テスト用の従業員アカウント
# パスワード: "password"（bcryptでハッシュ化）
# アカウント状態は「有効(verified)」と「閉鎖(closed)」の 2 つで閉じている（ADR 0007）

verified_employee:
  username: employee
  password_hash: <%= RodauthApp.rodauth(:employee).allocate.password_hash("password") %>
  status: verified

closed_employee:
  username: closed_employee
  password_hash: <%= RodauthApp.rodauth(:employee).allocate.password_hash("password") %>
  status: closed

owner_employee:
  username: owner
  password_hash: <%= RodauthApp.rodauth(:employee).allocate.password_hash("password") %>
  status: verified
