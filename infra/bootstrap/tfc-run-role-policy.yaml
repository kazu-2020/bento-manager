AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  HCP Terraform の run ロールに付与する権限ポリシー。
  責任分界と経緯は docs/adr/0002-backup-infrastructure.md の決定 5 を参照。

Parameters:
  RunRoleName:
    Type: String
    Default: tfc-bento-manager-run
    Description: >-
      権限をアタッチする対象のロール名。
      ワークスペースの環境変数 TFC_AWS_RUN_ROLE_ARN が指すロールと一致させること。

Resources:
  # Resource はいずれも "*"。理由は ADR-0002 の決定不要として閉じた論点
  # 「run ロールの Resource 限定」を参照。
  #
  # 一方でアクションは絞る。Resource を開放した以上ここが唯一の歯止めであり、
  # infra/terraform が実際に作るリソースから導出した範囲だけを許可する。
  TfcRunPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${RunRoleName}-permissions"
      # Description は更新時に置換が必要なプロパティ（IAM API に説明の更新手段がない）。
      # 変更すると同名のポリシーを作ろうとして AlreadyExists で失敗するため、迂闊に触らない。
      Description: >-
        ADR-0001 のバックアップ基盤（S3 バケットと Litestream 用 IAM ユーザー）を
        構築するために必要な最小限の権限
      Roles:
        - !Ref RunRoleName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # バケットの作成と設定。オブジェクト操作は含めない。
          # Terraform はバケットを作るだけで中身に触れない。
          #
          # 末尾 4 つは s3:GetBucket* に一致しない別アクション名で、
          # aws_s3_bucket の read が実際に呼ぶため個別に列挙する。
          - Sid: ManageBuckets
            Effect: Allow
            Action:
              - s3:CreateBucket
              - s3:DeleteBucket
              - s3:ListBucket
              - s3:GetBucket*
              - s3:PutBucket*
              - s3:GetLifecycleConfiguration
              - s3:PutLifecycleConfiguration
              - s3:GetEncryptionConfiguration
              - s3:PutEncryptionConfiguration
              - s3:GetAccelerateConfiguration
              - s3:GetReplicationConfiguration
            Resource: "*"

          # IAM ユーザーの管理。
          #
          # アクセスキー系（CreateAccessKey / DeleteAccessKey / ListAccessKeys）は
          # 意図的に含めない。ADR-0002 決定 6 の「アクセスキーを state に載せない」を
          # 規約ではなく権限で表現するため。terraform apply がキーを発行する経路自体が
          # 存在しなくなる。
          #
          # iam:CreateRole も含めない。別アカウントから引けるロールを作られる経路を塞ぐ。
          # ただし iam:PutUserPolicy がある以上、任意の権限を持つユーザー自体は作れる。
          # 完全な防御ではなく難易度を上げる措置である。
          - Sid: ManageUsers
            Effect: Allow
            Action:
              - iam:CreateUser
              - iam:DeleteUser
              - iam:GetUser
              - iam:TagUser
              - iam:UntagUser
              - iam:ListUserTags
              - iam:PutUserPolicy
              - iam:GetUserPolicy
              - iam:DeleteUserPolicy
            Resource: "*"

Outputs:
  PolicyArn:
    Description: 作成したマネージドポリシーの ARN
    Value: !Ref TfcRunPolicy
