name: CI

on:
  pull_request:
  push:
    branches: [ main ]

# 既定の権限は与えず、ジョブごとに必要な分だけ宣言する。
permissions: {}

jobs:
  scan_ruby:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  # PR で追加・更新された依存だけを GitHub Advisory と突き合わせる。既存の
  # 脆弱性では落ちないので、bundler-audit と違って CI が赤いまま固定されない。
  # dependency graph を使う都合上 pull_request でしか動かせない。
  dependency_review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  lint_workflows:
    runs-on: ubuntu-latest
    # actionlint のリリース取得と attestation の検証は読み取り権限だけで足りる。
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: 1.7.12

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # 取得した資産は artifact attestation で検証する。actionlint のリリースを
      # ビルドしたワークフローの出自を確認するもので、公式が推奨している方法。
      - name: Install actionlint
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: actionlint_${{ env.ACTIONLINT_VERSION }}_linux_amd64.tar.gz
        run: |
          gh release download "v${ACTIONLINT_VERSION}" --repo rhysd/actionlint --pattern "$ARCHIVE"
          gh attestation verify --repo rhysd/actionlint "$ARCHIVE"
          tar xzf "$ARCHIVE" actionlint

      # ワークフローの構文、式、権限指定に加え、run の中身を shellcheck で検査する。
      - name: Lint GitHub Actions workflows
        run: ./actionlint -color

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  herb_lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install JavaScript dependencies
        run: npm ci

      # stale な .herb.yml でも herb-lint は exit 0 を返し、新ルールが
      # skipped (version) のまま CI が緑で通ってしまう。Dependabot による
      # linter の bump がここで赤くなるよう、両者の一致を突き合わせる。
      - name: Check .herb.yml version matches the installed linter
        run: |
          configured=$(grep -E '^version:' .herb.yml | awk '{print $2}' | tr -d '"'"'"'')
          installed=$(node -p "require('@herb-tools/linter/package.json').version")
          if [ "$configured" != "$installed" ]; then
            echo "::error::.herb.yml version ($configured) != @herb-tools/linter ($installed). Run 'npm run herb:lint -- --upgrade' and review the newly enabled rules."
            exit 1
          fi

      - name: Lint ERB templates
        run: npm run herb:lint

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # services:
    #  redis:
    #    image: valkey/valkey:8
    #    ports:
    #      - 6379:6379
    #    options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build Vite assets for test
        env:
          RAILS_ENV: test
        run: bin/vite build --mode=test

      - name: Run tests
        env:
          RAILS_ENV: test
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test

  # system テストはブラウザを起動するぶん遅く、フレークもしうる。単体テストと同じ
  # ジョブに混ぜると 677 本の単体テストの速いフィードバックまで巻き込まれる。分ければ
  # GitHub Actions が並列に走らせるので実時間は増えず、落ちた原因の切り分けも早い。
  # ubuntu-latest には Chrome が同梱されており、chromedriver は Selenium Manager が
  # 自動取得するため、ブラウザのインストール手順は要らない。
  system_test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install JavaScript dependencies
        run: npm ci

      # config/vite.json の test は autoBuild だが、任せると最初の visit が
      # コールドビルドを待つことになる。CI では明示的に先に済ませる
      - name: Build Vite assets for test
        env:
          RAILS_ENV: test
        run: bin/vite build --mode=test

      # bin/rails test は test/system を含まない。system テストは専用タスクで回す
      - name: Run system tests
        env:
          RAILS_ENV: test
        run: bin/rails db:test:prepare test:system

      # 画面のスクリーンショット無しに system テストの失敗は追えない
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: system-test-screenshots
          path: tmp/screenshots
          if-no-files-found: ignore

  # db/seeds.rb はテストから呼ばれないため、壊れても通常のテストでは気付けない。
  # 空の DB に流し直して投入できることだけを独立して確認する。
  seeds:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Load seeds into a freshly prepared database
        env:
          RAILS_ENV: test
        # 同一プロセスでチェーンすると db:test:prepare 後のコネクションが古いスキーマを
        # 掴んだままになり seed が落ちるため、rails は 2 回に分けて起動する。
        run: |
          bin/rails db:test:prepare
          bin/rails db:seed:replant
