name: Dependabot auto-merge

# Dependabot の PR のうち minor / patch 更新を auto-merge の対象にする。
#
# auto-merge が待つのは Ruleset で「必須」に指定されたチェックだけで、CI 全体ではない。
# main の Ruleset に scan_ruby / lint / test を必須チェックとして登録していない場合、
# 待機対象が無いため CI の結果と無関係にマージされる。この 2 つはセットで運用すること。
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      # グループ PR の場合、update-type にはグループ内で最も大きい更新種別が入る。
      # major を 1 つでも含むグループは手動レビューに回る。
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # major を除外する否定形ではなく許可リストで判定する。update-type が空になる
      # ケース（更新種別を解決できなかった場合）に否定形だと条件が真になり素通りするため。
      - name: Enable auto-merge for minor and patch updates
        if: contains(fromJSON('["version-update:semver-minor", "version-update:semver-patch"]'), steps.metadata.outputs.update-type)
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --merge "$PR_URL"
