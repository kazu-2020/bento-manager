name: Dependabot auto-merge

# Dependabot の PR のうち minor / patch 更新を auto-merge の対象にする。
#
# auto-merge が待つのは Ruleset で「必須」に指定されたチェックだけで、CI 全体ではない。
# main の Ruleset に lint / test を必須チェックとして登録していない場合、
# 待機対象が無いため CI の結果と無関係にマージされる。この 2 つはセットで運用すること。
on: pull_request_target

# pull_request_target は書き込み可能なトークンで動くため、既定では何も許可せず
# ジョブ単位で必要な権限だけを付与する。
permissions: {}

jobs:
  # サードパーティの action を動かすジョブ。書き込み権限を持たせない。
  metadata:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      update-type: ${{ steps.metadata.outputs.update-type }}

    steps:
      # グループ PR の場合、update-type にはグループ内で最も大きい更新種別が入る。
      # major を 1 つでも含むグループは手動レビューに回る。
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2.5.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # 書き込み権限を持つジョブ。実行するのは gh コマンドだけに限定する。
  # major を除外する否定形ではなく許可リストで判定する。update-type が空になる
  # ケース（更新種別を解決できなかった場合）に否定形だと条件が真になり素通りするため。
  auto-merge:
    needs: metadata
    if: contains(fromJSON('["version-update:semver-minor", "version-update:semver-patch"]'), needs.metadata.outputs.update-type)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Enable auto-merge for minor and patch updates
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --merge "$PR_URL"
